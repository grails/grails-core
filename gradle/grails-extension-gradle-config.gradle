// do not cache SNAPSHOT dependencies
//dependencyManagement {
//    resolutionStrategy {
//        cacheChangingModulesFor 0, 'seconds'
//        cacheDynamicVersionsFor 0, 'seconds'
//    }
//}

grails {
    // WARNING: enabling spring dependency management in core can have unintended side effects.
    // since it loads the bom via a pom file, it can't use a gradle project() reference
    // this means you MUST publish locally via ./gradlew :grails-bom:publishMavenPublicationToLocalBomRepository
    // this causes unexpected version mismatches in the various plugin projects
    springDependencyManagement = false

    // Allow CI to toggle Groovy invokedynamic (indy) via -PgrailsIndy=true/false
    // This enables testing functional tests with both indy enabled and disabled.
    // See: https://github.com/apache/grails-core/issues/15321
    // Published framework modules inherit the same default from CompilePlugin.
    if (project.hasProperty('grailsIndy')) {
        indy = project.property('grailsIndy').toString().trim().toBoolean()
    }
}

// GROOVY-11158: Groovy 6 generates classic (non-invokedynamic) call sites only with the optional
// groovy-callsite module on the classpath. Grails does not carry it: an application that opts out with
// grails { indy = false } declares it itself, so an application that keeps the default never ships it.
// The -PgrailsIndy=false CI lane compiles every source set of this project that way, so it declares the
// module here for each of them. The version is named outright, read from the map in dependencies.gradle
// that the BOM projects publish, because the ast source set the Grails plugin gives a plugin project has
// no platform on its configurations to supply one.
if (project.hasProperty('grailsIndy') && !project.property('grailsIndy').toString().trim().toBoolean()) {
    if (!rootProject.ext.has('bomDependencyVersions')) {
        rootProject.apply from: rootProject.layout.projectDirectory.file('dependencies.gradle')
    }
    String callSiteModule = "org.apache.groovy:groovy-callsite:${rootProject.ext.bomDependencyVersions['groovy.version']}"
    sourceSets.configureEach { SourceSet sourceSet ->
        dependencies.add(sourceSet.implementationConfigurationName, callSiteModule)
    }
}
